<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniTools - Hub de Utilitários Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200 custom-scroll">

    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white">Omni<span class="text-blue-600 dark:text-blue-400">Tools</span></span>
                    <span class="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-bold bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300 rounded-full">v2.0</span>
                </div>
            </div>

            <div class="flex-1 max-w-md relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterTools()" placeholder="Pesquisar ferramenta..." class="w-full pl-10 pr-4 py-2 text-sm bg-slate-100 dark:bg-slate-800 border border-transparent focus:border-blue-500 focus:bg-white dark:focus:bg-slate-950 rounded-xl outline-none transition-all">
            </div>

            <div class="flex items-center gap-2">
                <!-- Language Switcher -->
                <button onclick="toggleLanguage()" id="langBtn" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold text-slate-700 dark:text-slate-300 transition-all flex items-center gap-1.5 border border-slate-200 dark:border-slate-700">
                    <i data-lucide="languages" class="w-4 h-4 text-blue-600 dark:text-blue-400"></i>
                    <span id="currentLangLabel">PT</span>
                </button>

                <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-all">
                    <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
                    <i data-lucide="moon" class="w-5 h-5 block dark:hidden"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-1 flex flex-col md:flex-row gap-6">
        <aside class="w-full md:w-64 flex-shrink-0">
            <div class="sticky top-22 bg-white dark:bg-slate-800/50 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                <p class="px-3 py-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Categorias</p>
                <nav id="categoryNav" class="space-y-1">
                </nav>
            </div>
        </aside>

        <main class="flex-1 min-w-0">
            <div id="gridHeader" class="flex items-center justify-between mb-6">
                <div>
                    <h2 id="currentCategoryTitle" class="text-2xl font-bold text-slate-900 dark:text-white">Todas as Ferramentas</h2>
                    <p id="toolsCounter" class="text-sm text-slate-500 dark:text-slate-400">Exibindo utilitários disponíveis</p>
                </div>
            </div>

            <div id="toolsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>

            <div id="noResults" class="hidden text-center py-16 bg-white dark:bg-slate-800/30 rounded-2xl border border-dashed border-slate-300 dark:border-slate-700">
                <i data-lucide="search-x" class="w-12 h-12 text-slate-400 mx-auto mb-3"></i>
                <h3 id="noResultsTitle" class="text-base font-semibold text-slate-700 dark:text-slate-300">Nenhuma ferramenta encontrada</h3>
                <p id="noResultsDesc" class="text-sm text-slate-400 mt-1">Tente pesquisar por outros termos ou selecionar outra categoria.</p>
            </div>
        </main>
    </div>

    <div id="toolModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden transform scale-95 transition-transform duration-200" id="modalBox">
            <div class="p-4 sm:p-5 border-b border-slate-100 dark:border-slate-700/60 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/50">
                <div class="flex items-center gap-3">
                    <div id="modalIcon" class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center"></div>
                    <div>
                        <h3 id="modalTitle" class="font-bold text-slate-900 dark:text-white text-lg leading-tight"></h3>
                        <p id="modalCategory" class="text-xs text-blue-600 dark:text-blue-400 font-semibold uppercase tracking-wider mt-0.5"></p>
                    </div>
                </div>
                <button onclick="closeModal()" class="p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modalBody" class="p-5 sm:p-6 overflow-y-auto custom-scroll flex-1">
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300 z-50 pointer-events-none">
        <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400 dark:text-emerald-600"></i>
        <span id="toastMsg" class="text-sm font-semibold"></span>
    </div>

    <!-- Footer with Creator Credits -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-900/50 backdrop-blur-sm py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
            <p>© <span id="currentYear"></span> OmniTools. <span id="allRightsText">Todos os direitos reservados.</span></p>
            <div class="flex items-center gap-1.5 font-medium">
                <span id="createdByText">Criado originalmente por</span>
                <a href="https://github.com/SonicLuigi404" target="_blank" rel="noopener noreferrer" class="font-bold text-blue-600 dark:text-blue-400 hover:underline flex items-center gap-1 transition-colors">
                    <i data-lucide="github" class="w-3.5 h-3.5"></i>
                    <span>SonicLuigi404</span>
                </a>
            </div>
        </div>
    </footer>

    <script>
        // Dictionary for bilingual support
        const TRANSLATIONS = {
            pt: {
                searchPlaceholder: "Pesquisar ferramenta...",
                categoriesTitle: "Categorias",
                allCategories: "Todas",
                allToolsTitle: "Todas as Ferramentas",
                displayingTools: (count, total) => `Exibindo ${count} de ${total} utilitários`,
                noResultsTitle: "Nenhuma ferramenta encontrada",
                noResultsDesc: "Tente pesquisar por outros termos ou selecionar outra categoria.",
                openTool: "Abrir ferramenta",
                copiedToast: "Copiado para a área de transferência!",
                timerEnded: "Tempo esgotado!",
                allRights: "Todos os direitos reservados.",
                createdBy: "Criado originalmente por",
                categories: {
                    "Utilitários": "Utilitários",
                    "Desenvolvedor": "Desenvolvedor",
                    "Texto": "Texto",
                    "Matemática & Finanças": "Matemática & Finanças",
                    "Mídia/Imagens": "Mídia/Imagens"
                },
                tools: {
                    qrcode: { name: "Gerador de QR Code", desc: "Crie códigos QR para links, textos ou redes Wi-Fi instantaneamente." },
                    password: { name: "Gerador de Senhas", desc: "Crie senhas altamente seguras personalizando tamanho e caracteres." },
                    counter: { name: "Contador de Texto", desc: "Estatísticas de caracteres, palavras, linhas e tempo estimado de leitura." },
                    case: { name: "Conversor de Texto", desc: "Alterne entre Maiúsculas, Minúsculas, Title Case, Inverter e Limpar Espaços." },
                    json: { name: "Formatador JSON", desc: "Valide, idente e formatar estruturas de dados JSON facilmente." },
                    palette: { name: "Gerador de Paleta", desc: "Gere combinações de cores aleatórias em HEX, RGB e HSL." },
                    percent: { name: "Calculadora de Porcentagem", desc: "Calcule aumentos, descontos e variações percentuais em segundos." },
                    timer: { name: "Cronômetro & Temporizador", desc: "Medidor de tempo preciso com contagem regressiva e alarme." },
                    hash: { name: "Encoder & Base64", desc: "Codifique ou decodifique textos em Base64 e URI Encode." },
                    regex: { name: "Testador de RegEx", desc: "Valide expressões regulares contra textos de teste em tempo real." },
                    units: { name: "Conversor de Unidades", desc: "Converta medidas de Comprimento, Peso e Temperatura." },
                    random: { name: "Sorteador & Decisor", desc: "Sorteie números aleatórios ou escolha itens de uma lista." }
                }
            },
            en: {
                searchPlaceholder: "Search tool...",
                categoriesTitle: "Categories",
                allCategories: "All",
                allToolsTitle: "All Tools",
                displayingTools: (count, total) => `Showing ${count} of ${total} utilities`,
                noResultsTitle: "No tools found",
                noResultsDesc: "Try searching for other terms or select another category.",
                openTool: "Open tool",
                copiedToast: "Copied to clipboard!",
                timerEnded: "Time is up!",
                allRights: "All rights reserved.",
                createdBy: "Originally created by",
                categories: {
                    "Utilitários": "Utilities",
                    "Desenvolvedor": "Developer",
                    "Texto": "Text",
                    "Matemática & Finanças": "Math & Finance",
                    "Mídia/Imagens": "Media/Images"
                },
                tools: {
                    qrcode: { name: "QR Code Generator", desc: "Instantly generate QR codes for links, text, or Wi-Fi networks." },
                    password: { name: "Password Generator", desc: "Create highly secure passwords with custom length and characters." },
                    counter: { name: "Text Counter", desc: "Real-time statistics for characters, words, lines, and reading time." },
                    case: { name: "Text Converter", desc: "Toggle uppercase, lowercase, title case, reverse, and trim spaces." },
                    json: { name: "JSON Formatter", desc: "Validate, format, and beautify JSON data structures easily." },
                    palette: { name: "Palette Generator", desc: "Generate random color schemes with HEX, RGB, and HSL values." },
                    percent: { name: "Percentage Calculator", desc: "Calculate percentage increases, discounts, and variations." },
                    timer: { name: "Stopwatch & Timer", desc: "Accurate timer and stopwatch with countdown alerts." },
                    hash: { name: "Encoder & Base64", desc: "Encode or decode text in Base64 and URI Encode formats." },
                    regex: { name: "RegEx Tester", desc: "Test and validate regular expressions in real-time." },
                    units: { name: "Unit Converter", desc: "Convert measurements for Length, Weight, and Temperature." },
                    random: { name: "Random Picker", desc: "Pick random numbers or select items from a custom list." }
                }
            }
        };

        const CATEGORIES_KEYS = ["Todas", "Utilitários", "Desenvolvedor", "Texto", "Matemática & Finanças", "Mídia/Imagens"];

        const TOOLS = [
            { id: "qrcode", cat: "Mídia/Imagens", icon: "qr-code" },
            { id: "password", cat: "Utilitários", icon: "shield-check" },
            { id: "counter", cat: "Texto", icon: "file-text" },
            { id: "case", cat: "Texto", icon: "type" },
            { id: "json", cat: "Desenvolvedor", icon: "code-2" },
            { id: "palette", cat: "Mídia/Imagens", icon: "palette" },
            { id: "percent", cat: "Matemática & Finanças", icon: "percent" },
            { id: "timer", cat: "Utilitários", icon: "timer" },
            { id: "hash", cat: "Desenvolvedor", icon: "binary" },
            { id: "regex", cat: "Desenvolvedor", icon: "regex" },
            { id: "units", cat: "Matemática & Finanças", icon: "arrow-right-left" },
            { id: "random", cat: "Utilitários", icon: "dices" }
        ];

        let currentLang = 'pt';
        let activeCategory = "Todas";
        let timerInterval = null;
        let timerSeconds = 0;
        let stopwatchInterval = null;
        let stopwatchTime = 0;

        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
        }

        function detectLanguage() {
            const userLang = navigator.language || navigator.userLanguage || 'pt';
            currentLang = userLang.toLowerCase().startsWith('pt') ? 'pt' : 'en';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'pt' ? 'en' : 'pt';
            updateStaticText();
            renderCategories();
            filterTools();
        }

        function updateStaticText() {
            const t = TRANSLATIONS[currentLang];
            document.getElementById('currentLangLabel').innerText = currentLang.toUpperCase();
            document.getElementById('searchInput').placeholder = t.searchPlaceholder;
            document.getElementById('noResultsTitle').innerText = t.noResultsTitle;
            document.getElementById('noResultsDesc').innerText = t.noResultsDesc;
            
            const catNavHeader = document.querySelector('aside p');
            if (catNavHeader) catNavHeader.innerText = t.categoriesTitle;

            document.getElementById('currentCategoryTitle').innerText = activeCategory === 'Todas' ? t.allToolsTitle : (t.categories[activeCategory] || activeCategory);

            // Footer updates
            document.getElementById('allRightsText').innerText = t.allRights;
            document.getElementById('createdByText').innerText = t.createdBy;
            document.getElementById('currentYear').innerText = new Date().getFullYear();
        }

        function init() {
            detectLanguage();
            updateStaticText();
            renderCategories();
            renderTools();
            lucide.createIcons();
            
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        }

        function renderCategories() {
            const t = TRANSLATIONS[currentLang];
            const container = document.getElementById('categoryNav');
            container.innerHTML = CATEGORIES_KEYS.map(catKey => {
                const isActive = catKey === activeCategory;
                const catName = catKey === 'Todas' ? t.allCategories : (t.categories[catKey] || catKey);
                return `
                    <button onclick="selectCategory('${catKey}')" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium transition-all ${isActive ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
                        <span>${catName}</span>
                        <span class="text-xs px-2 py-0.5 rounded-full ${isActive ? 'bg-blue-100 dark:bg-blue-800 text-blue-700 dark:text-blue-200' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">${catKey === 'Todas' ? TOOLS.length : TOOLS.filter(tool => tool.cat === catKey).length}</span>
                    </button>
                `;
            }).join('');
        }

        function selectCategory(catKey) {
            activeCategory = catKey;
            const t = TRANSLATIONS[currentLang];
            document.getElementById('currentCategoryTitle').innerText = catKey === 'Todas' ? t.allToolsTitle : (t.categories[catKey] || catKey);
            renderCategories();
            filterTools();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            selectCategory('Todas');
        }

        function filterTools() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const t = TRANSLATIONS[currentLang];

            const filtered = TOOLS.filter(tool => {
                const toolInfo = t.tools[tool.id];
                const matchesCat = activeCategory === 'Todas' || tool.cat === activeCategory;
                const matchesQuery = toolInfo.name.toLowerCase().includes(query) || toolInfo.desc.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });

            renderTools(filtered);
        }

        function renderTools(list = TOOLS) {
            const grid = document.getElementById('toolsGrid');
            const noResults = document.getElementById('noResults');
            const t = TRANSLATIONS[currentLang];

            document.getElementById('toolsCounter').innerText = t.displayingTools(list.length, TOOLS.length);

            if (list.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = list.map(tool => {
                const info = t.tools[tool.id];
                const catLabel = t.categories[tool.cat] || tool.cat;
                return `
                <div onclick="openTool('${tool.id}')" class="group bg-white dark:bg-slate-800/60 hover:bg-blue-50/50 dark:hover:bg-slate-800 p-5 rounded-2xl border border-slate-200/80 dark:border-slate-800 hover:border-blue-300 dark:hover:border-blue-500/50 transition-all duration-200 shadow-sm hover:shadow-md cursor-pointer flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 flex items-center justify-center group-hover:scale-110 transition-transform">
                                <i data-lucide="${tool.icon}" class="w-5 h-5"></i>
                            </div>
                            <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider bg-slate-100 dark:bg-slate-800/80 px-2 py-1 rounded-md">${catLabel}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">${info.name}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1.5 leading-relaxed line-clamp-2">${info.desc}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700/50 flex items-center text-xs font-semibold text-blue-600 dark:text-blue-400 opacity-0 group-hover:opacity-100 transition-opacity">
                        <span>${t.openTool}</span>
                        <i data-lucide="arrow-right" class="w-3.5 h-3.5 ml-1"></i>
                    </div>
                </div>
            `}).join('');
            lucide.createIcons();
        }

        function openTool(id) {
            const tool = TOOLS.find(t => t.id === id);
            if (!tool) return;

            const t = TRANSLATIONS[currentLang];
            const info = t.tools[id];

            document.getElementById('modalTitle').innerText = info.name;
            document.getElementById('modalCategory').innerText = t.categories[tool.cat] || tool.cat;
            document.getElementById('modalIcon').innerHTML = `<i data-lucide="${tool.icon}" class="w-6 h-6"></i>`;
            
            const body = document.getElementById('modalBody');
            body.innerHTML = getToolHTML(id);
            lucide.createIcons();

            const modal = document.getElementById('toolModal');
            const box = document.getElementById('modalBox');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');

            initToolLogic(id);
        }

        function closeModal() {
            const modal = document.getElementById('toolModal');
            const box = document.getElementById('modalBox');
            box.classList.remove('scale-100');
            box.classList.add('scale-95');
            modal.classList.add('opacity-0', 'pointer-events-none');

            if (timerInterval) clearInterval(timerInterval);
            if (stopwatchInterval) clearInterval(stopwatchInterval);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        function getToolHTML(id) {
            const isPt = currentLang === 'pt';
            switch (id) {
                case 'qrcode':
                    return `
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">${isPt ? 'Conteúdo do QR Code' : 'QR Code Content'}</label>
                                <input type="text" id="qrInput" placeholder="https://example.com" class="w-full px-3 py-2 text-sm bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:border-blue-500">
                            </div>
                            <div class="flex justify-center p-4 bg-white rounded-xl border border-slate-200 dark:border-slate-700 min-h-[160px] items-center" id="qrContainer">
                                <p class="text-xs text-slate-400">${isPt ? 'Digite algo para gerar' : 'Type something to generate'}</p>
                            </div>
                        </div>
                    `;
                case 'password':
                    return `
                        <div class="space-y-4">
                            <div>
                                <div class="flex justify-between text-xs font-bold text-slate-500 mb-1">
                                    <span>${isPt ? 'Tamanho da Senha' : 'Password Length'}</span>
                                    <span id="pwdLenLabel">16</span>
                                </div>
                                <input type="range" id="pwdLen" min="6" max="32" value="16" oninput="document.getElementById('pwdLenLabel').innerText=this.value; generatePassword();" class="w-full accent-blue-600">
                            </div>
                            <div class="space-y-2 text-xs font-medium text-slate-700 dark:text-slate-300">
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="pwdUpper" checked onchange="generatePassword()" class="rounded text-blue-600"> ${isPt ? 'Letras Maiúsculas (A-Z)' : 'Uppercase (A-Z)'}</label>
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="pwdNum" checked onchange="generatePassword()" class="rounded text-blue-600"> ${isPt ? 'Números (0-9)' : 'Numbers (0-9)'}</label>
                                <label class="flex items-center gap-2 cursor-pointer"><input type="checkbox" id="pwdSym" checked onchange="generatePassword()" class="rounded text-blue-600"> ${isPt ? 'Símbolos (!@#$)' : 'Symbols (!@#$)'}</label>
                            </div>
                            <div class="flex gap-2">
                                <input type="text" id="pwdResult" readonly class="flex-1 px-3 py-2 text-sm font-mono bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl outline-none">
                                <button onclick="copyToClipboard(document.getElementById('pwdResult').value)" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition-all">${isPt ? 'Copiar' : 'Copy'}</button>
                            </div>
                        </div>
                    `;
                case 'counter':
                    return `
                        <div class="space-y-4">
                            <textarea id="counterText" oninput="updateCounterStats()" rows="5" placeholder="${isPt ? 'Cole ou digite seu texto aqui...' : 'Type or paste your text here...'}" class="w-full p-3 text-sm bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:border-blue-500"></textarea>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center">
                                <div class="bg-slate-100 dark:bg-slate-700/40 p-2.5 rounded-xl"><p class="text-xs text-slate-400 font-semibold">${isPt ? 'Caracteres' : 'Characters'}</p><p id="cntChars" class="text-base font-bold text-blue-600 dark:text-blue-400">0</p></div>
                                <div class="bg-slate-100 dark:bg-slate-700/40 p-2.5 rounded-xl"><p class="text-xs text-slate-400 font-semibold">${isPt ? 'Palavras' : 'Words'}</p><p id="cntWords" class="text-base font-bold text-blue-600 dark:text-blue-400">0</p></div>
                                <div class="bg-slate-100 dark:bg-slate-700/40 p-2.5 rounded-xl"><p class="text-xs text-slate-400 font-semibold">${isPt ? 'Linhas' : 'Lines'}</p><p id="cntLines" class="text-base font-bold text-blue-600 dark:text-blue-400">0</p></div>
                                <div class="bg-slate-100 dark:bg-slate-700/40 p-2.5 rounded-xl"><p class="text-xs text-slate-400 font-semibold">${isPt ? 'Leitura' : 'Reading Time'}</p><p id="cntTime" class="text-base font-bold text-blue-600 dark:text-blue-400">0s</p></div>
                            </div>
                        </div>
                    `;
                case 'case':
                    return `
                        <div class="space-y-4">
                            <textarea id="caseText" rows="4" placeholder="${isPt ? 'Digite seu texto...' : 'Type your text...'}" class="w-full p-3 text-sm bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:border-blue-500"></textarea>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                <button onclick="transformCase('upper')" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-blue-600 hover:text-white rounded-xl text-xs font-bold transition-all">MAIÚSCULAS</button>
                                <button onclick="transformCase('lower')" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-blue-600 hover:text-white rounded-xl text-xs font-bold transition-all">minúsculas</button>
                                <button onclick="transformCase('title')" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-blue-600 hover:text-white rounded-xl text-xs font-bold transition-all">Title Case</button>
                                <button onclick="transformCase('reverse')" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-blue-600 hover:text-white rounded-xl text-xs font-bold transition-all">${isPt ? 'Inverter' : 'Reverse'}</button>
                                <button onclick="transformCase('trim')" class="px-3 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-blue-600 hover:text-white rounded-xl text-xs font-bold transition-all">${isPt ? 'Limpar Espaços' : 'Trim Spaces'}</button>
                                <button onclick="copyToClipboard(document.getElementById('caseText').value)" class="px-3 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition-all">${isPt ? 'Copiar Texto' : 'Copy Text'}</button>
                            </div>
                        </div>
                    `;
                case 'json':
                    return `
                        <div class="space-y-3">
                            <textarea id="jsonInput" rows="6" placeholder='{"key": "value"}' class="w-full p-3 text-xs font-mono bg-slate-100 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:border-blue-500"></textarea>
                            <div class="flex gap-2">
                                <button onclick="formatJSON()" class="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition-all">${isPt ? 'Formatar JSON' : 'Format JSON'}</button>
                                <button onclick="copyToClipboard(document.getElementById('jsonInput').value)" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-xs font-bold rounded-xl transition-all">${isPt ? 'Copiar' : 'Copy'}</button>
                            </div>
                        </div>
                    `;
                case 'palette':
                    return `
                        <div class="space-y-4">
                            <div id="paletteBoxes" class="grid grid-cols-5 gap-2 h-24"></div>
                            <button onclick="generatePalette()" class="w-full py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition-all">${isPt ? 'Gerar Novas Cores' : 'Generate New Palette'}</button>
                        </div>
                    `;
                case 'percent':
                    return `
                        <div class="space-y-4 text-xs">
                            <div class="p-3 bg-slate-100 dark:bg-slate-700/40 rounded-xl space-y-2">
                                <p class="font-bold text-slate-600 dark:text-slate-300">${isPt ? 'Quanto é X% de Y?' : 'What is X% of Y?'}</p>
                                <div class="flex items-center gap-2">
                                    <input type="number" id="pct1" placeholder="%" class="w-20 p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 outline-none">
                                    <span>${isPt ? 'de' : 'of'}</span>
                                    <input type="number" id="val1" placeholder="100" class="w-24 p-2 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 outline-none">
                                    <button onclick="calcPct1()" class="px-3 py-2 bg-blue-600 text-white font-bold rounded-lg">=</button>
                                    <span id="resPct1" class="font-bold text-blue-600 dark:text-blue-400"></span>
                                </div>
                            </div>
                        </div>
                    `;
                case 'timer':
                    return `
                        <div class="space-y-4 text-center">
                            <div class="text-4xl font-extrabold font-mono text-blue-600 dark:text-blue-400" id="tmDisplay">05:00</div>
                            <div class="flex items-center justify-center gap-2">
                                <input type="number" id="tmMin" value="5" placeholder="Min" class="w-16 p-2 text-center text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none">
                                <span class="font-bold">:</span>
                                <input type="number" id="tmSec" value="0" placeholder="Sec" class="w-16 p-2 text-center text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none">
                            </div>
                            <button onclick="startTimer()" class="px-6 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 transition-all">${isPt ? 'Iniciar Temporizador' : 'Start Timer'}</button>
                        </div>
                    `;
                case 'hash':
                    return `
                        <div class="space-y-3">
                            <input type="text" id="hashInput" oninput="processHash()" placeholder="${isPt ? 'Digite o texto...' : 'Type text...'}" class="w-full p-2.5 text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none">
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Base64</label>
                                <input type="text" id="resB64Enc" readonly class="w-full p-2 text-xs font-mono bg-slate-100 dark:bg-slate-700/50 rounded-xl">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">URL Encode</label>
                                <input type="text" id="resUriEnc" readonly class="w-full p-2 text-xs font-mono bg-slate-100 dark:bg-slate-700/50 rounded-xl">
                            </div>
                        </div>
                    `;
                case 'regex':
                    return `
                        <div class="space-y-3">
                            <input type="text" id="regPattern" oninput="testRegex()" placeholder="RegEx (ex: [0-9]+)" class="w-full p-2.5 text-xs font-mono bg-slate-100 dark:bg-slate-700 rounded-xl outline-none">
                            <textarea id="regText" oninput="testRegex()" rows="3" placeholder="${isPt ? 'Texto de teste...' : 'Test text...'}" class="w-full p-2.5 text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none"></textarea>
                            <div id="regStatus"></div>
                        </div>
                    `;
                case 'units':
                    return `
                        <div class="space-y-3">
                            <select id="unitType" onchange="updateUnitTypes()" class="w-full p-2 text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none">
                                <option value="length">${isPt ? 'Comprimento' : 'Length'}</option>
                                <option value="weight">${isPt ? 'Peso' : 'Weight'}</option>
                                <option value="temp">${isPt ? 'Temperatura' : 'Temperature'}</option>
                            </select>
                            <div class="flex gap-2">
                                <input type="number" id="unitVal" value="1" oninput="convertUnits()" class="w-24 p-2 text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none">
                                <select id="unitFrom" onchange="convertUnits()" class="flex-1 p-2 text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none"></select>
                            </div>
                            <div class="p-3 bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 text-xs font-bold rounded-xl text-center" id="unitResult">---</div>
                        </div>
                    `;
                case 'random':
                    return `
                        <div class="space-y-3">
                            <div class="flex border-b border-slate-200 dark:border-slate-700">
                                <button id="tabRNum" onclick="switchRandTab('num')" class="flex-1 py-2 font-bold text-xs border-b-2 border-blue-600 text-blue-600">${isPt ? 'Número' : 'Number'}</button>
                                <button id="tabRList" onclick="switchRandTab('list')" class="flex-1 py-2 font-bold text-xs text-slate-400">${isPt ? 'Lista' : 'List'}</button>
                            </div>
                            <div id="rNumBox" class="space-y-3">
                                <div class="flex items-center gap-2">
                                    <input type="number" id="rndMin" value="1" class="w-full p-2 text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none">
                                    <span class="text-xs">${isPt ? 'até' : 'to'}</span>
                                    <input type="number" id="rndMax" value="100" class="w-full p-2 text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none">
                                </div>
                                <button onclick="drawNumber()" class="w-full py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">${isPt ? 'Sortehar Número' : 'Pick Number'}</button>
                                <div id="resRndNum" class="text-center font-bold text-xl text-blue-600 dark:text-blue-400"></div>
                            </div>
                            <div id="rListBox" class="space-y-3 hidden">
                                <textarea id="rndList" rows="3" placeholder="${isPt ? 'Um item por linha...' : 'One item per line...'}" class="w-full p-2 text-xs bg-slate-100 dark:bg-slate-700 rounded-xl outline-none"></textarea>
                                <button onclick="drawList()" class="w-full py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">${isPt ? 'Sortehar Item' : 'Pick Item'}</button>
                                <div id="resRndList" class="text-center font-bold text-sm text-blue-600 dark:text-blue-400"></div>
                            </div>
                        </div>
                    `;
                default:
                    return '';
            }
        }

        function initToolLogic(id) {
            if (id === 'qrcode') {
                const qrContainer = document.getElementById('qrContainer');
                const qrInput = document.getElementById('qrInput');
                qrInput.oninput = () => {
                    qrContainer.innerHTML = '';
                    if (qrInput.value.trim()) {
                        new QRCode(qrContainer, { text: qrInput.value, width: 128, height: 128 });
                    } else {
                        qrContainer.innerHTML = `<p class="text-xs text-slate-400">${currentLang === 'pt' ? 'Digite algo para gerar' : 'Type something to generate'}</p>`;
                    }
                };
            } else if (id === 'password') {
                generatePassword();
            } else if (id === 'palette') {
                generatePalette();
            } else if (id === 'units') {
                updateUnitTypes();
                convertUnits();
            }
        }

        function generatePassword() {
            const len = parseInt(document.getElementById('pwdLen').value) || 16;
            const upper = document.getElementById('pwdUpper').checked;
            const num = document.getElementById('pwdNum').checked;
            const sym = document.getElementById('pwdSym').checked;
            let chars = 'abcdefghijklmnopqrstuvwxyz';
            if (upper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (num) chars += '0123456789';
            if (sym) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            let res = '';
            for (let i = 0; i < len; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('pwdResult').value = res;
        }

        function updateCounterStats() {
            const text = document.getElementById('counterText').value;
            document.getElementById('cntChars').innerText = text.length;
            document.getElementById('cntWords').innerText = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('cntLines').innerText = text ? text.split('\n').length : 0;
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            document.getElementById('cntTime').innerText = `${Math.ceil(words / 200 * 60)}s`;
        }

        function transformCase(type) {
            const el = document.getElementById('caseText');
            if (type === 'upper') el.value = el.value.toUpperCase();
            if (type === 'lower') el.value = el.value.toLowerCase();
            if (type === 'title') el.value = el.value.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.substr(1).toLowerCase());
            if (type === 'reverse') el.value = el.value.split('').reverse().join('');
            if (type === 'trim') el.value = el.value.replace(/\s+/g, ' ').trim();
        }

        function formatJSON() {
            const el = document.getElementById('jsonInput');
            try {
                el.value = JSON.stringify(JSON.parse(el.value), null, 2);
            } catch (e) {
                showToast(currentLang === 'pt' ? 'JSON inválido!' : 'Invalid JSON!');
            }
        }

        function generatePalette() {
            const container = document.getElementById('paletteBoxes');
            if (!container) return;
            container.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const hex = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
                const box = document.createElement('div');
                box.className = 'rounded-xl h-full flex flex-col items-center justify-end p-1 text-[10px] font-mono text-white font-bold cursor-pointer hover:scale-105 transition-transform';
                box.style.backgroundColor = hex;
                box.innerText = hex;
                box.onclick = () => copyToClipboard(hex);
                container.appendChild(box);
            }
        }

        function calcPct1() {
            const p = parseFloat(document.getElementById('pct1').value) || 0;
            const v = parseFloat(document.getElementById('val1').value) || 0;
            document.getElementById('resPct1').innerText = ((p / 100) * v).toFixed(2);
        }

        function copyToClipboard(text) {
            const input = document.createElement('textarea');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            showToast(TRANSLATIONS[currentLang].copiedToast);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const m = parseInt(document.getElementById('tmMin').value) || 0;
            const s = parseInt(document.getElementById('tmSec').value) || 0;
            timerSeconds = (m * 60) + s;
            
            if (timerSeconds <= 0) return;

            timerInterval = setInterval(() => {
                timerSeconds--;
                const min = Math.floor(timerSeconds / 60);
                const sec = timerSeconds % 60;
                document.getElementById('tmDisplay').innerText = `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
                
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    showToast(TRANSLATIONS[currentLang].timerEnded);
                }
            }, 1000);
        }

        function processHash() {
            const txt = document.getElementById('hashInput').value;
            try {
                document.getElementById('resB64Enc').value = btoa(txt);
            } catch(e) {
                document.getElementById('resB64Enc').value = "Erro ao codificar";
            }
            document.getElementById('resUriEnc').value = encodeURIComponent(txt);
        }

        function testRegex() {
            const pat = document.getElementById('regPattern').value;
            const txt = document.getElementById('regText').value;
            const status = document.getElementById('regStatus');
            
            if (!pat || !txt) {
                status.innerText = '';
                return;
            }

            try {
                const rx = new RegExp(pat, 'g');
                const matches = txt.match(rx);
                if (matches) {
                    status.className = 'p-2 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300';
                    status.innerText = `${matches.length} correspondência(s) encontrada(s): ${matches.join(', ')}`;
                } else {
                    status.className = 'p-2 rounded-xl text-xs font-semibold bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300';
                    status.innerText = 'Nenhuma correspondência encontrada.';
                }
            } catch(e) {
                status.className = 'p-2 rounded-xl text-xs font-semibold bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300';
                status.innerText = 'RegEx inválida.';
            }
        }

        function updateUnitTypes() {
            const type = document.getElementById('unitType').value;
            const sel = document.getElementById('unitFrom');
            sel.innerHTML = '';
            if (type === 'length') {
                sel.innerHTML = '<option value="m">Metros</option><option value="ft">Pés</option><option value="in">Polegadas</option>';
            } else if (type === 'weight') {
                sel.innerHTML = '<option value="kg">Quilogramas</option><option value="lb">Libras</option><option value="g">Gramas</option>';
            } else {
                sel.innerHTML = '<option value="c">Celsius</option><option value="f">Fahrenheit</option>';
            }
        }

        function convertUnits() {
            const type = document.getElementById('unitType').value;
            const val = parseFloat(document.getElementById('unitVal').value) || 0;
            const from = document.getElementById('unitFrom').value;
            const res = document.getElementById('unitResult');

            if (type === 'length') {
                if (from === 'm') res.innerText = `${(val * 3.28084).toFixed(2)} ft / ${(val * 39.3701).toFixed(2)} in`;
                if (from === 'ft') res.innerText = `${(val / 3.28084).toFixed(2)} m / ${(val * 12).toFixed(2)} in`;
                if (from === 'in') res.innerText = `${(val / 39.3701).toFixed(2)} m / ${(val / 12).toFixed(2)} ft`;
            } else if (type === 'weight') {
                if (from === 'kg') res.innerText = `${(val * 2.20462).toFixed(2)} lbs / ${val * 1000} g`;
                if (from === 'lb') res.innerText = `${(val / 2.20462).toFixed(2)} kg / ${(val * 453.592).toFixed(2)} g`;
                if (from === 'g') res.innerText = `${val / 1000} kg / ${(val / 453.592).toFixed(4)} lbs`;
            } else {
                if (from === 'c') res.innerText = `${((val * 9/5) + 32).toFixed(1)} °F`;
                if (from === 'f') res.innerText = `${((val - 32) * 5/9).toFixed(1)} °C`;
            }
        }

        function switchRandTab(tab) {
            document.getElementById('rNumBox').classList.toggle('hidden', tab !== 'num');
            document.getElementById('rListBox').classList.toggle('hidden', tab !== 'list');
            document.getElementById('tabRNum').className = `flex-1 py-2 font-bold text-xs ${tab === 'num' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-slate-400'}`;
            document.getElementById('tabRList').className = `flex-1 py-2 font-bold text-xs ${tab === 'list' ? 'border-b-2 border-blue-600 text-blue-600' : 'text-slate-400'}`;
        }

        function drawNumber() {
            const min = parseInt(document.getElementById('rndMin').value) || 0;
            const max = parseInt(document.getElementById('rndMax').value) || 100;
            const num = Math.floor(Math.random() * (max - min + 1)) + min;
            document.getElementById('resRndNum').innerText = num;
        }

        function drawList() {
            const raw = document.getElementById('rndList').value.trim();
            if (!raw) return;
            const items = raw.split('\n').filter(i => i.trim() !== '');
            const selected = items[Math.floor(Math.random() * items.length)];
            document.getElementById('resRndList').innerText = selected;
        }

        window.onload = init;
    </script>
</body>
</html>
